<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/htmx.org@2.0.4"
        integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"
        crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../src/assets/styles/login.css">
    <link rel="stylesheet" href="../src/assets/styles/general.css">
    <title>Powerzone NG</title>
</head>

<body>


    <main>
        <header class="" id="">
            <nav class="navbar navbar-expand-lg">
                <div class="container-fluid" id="header__container">
                    <div class="logo">
                        <span>Powerzone NG</span>
                    </div>
                    <div class="nav__links">
                        <a href="" hx-get="/">Home</a>
                        <a href="" hx-get="/features">Features</a>
                        <a href="" hx-get="buy__units">Buy Units</a>
                        <a href="" hx-get="/support">Support</a>
                        <a href="" id="sign__up" hx-get="/signup">Sign Up</a>
                        <a href="" hx-get="/login" id="login">Login</a>

                    </div>
                    <div class="mobile__menu__icon">
                        <i class="fa-solid fa-bars" onclick="toggle__menu()"></i>
                    </div>
                </div>
            </nav>
        </header>


        <section class="login__section">
            <div class="login__header">
                <h1>Hi, Welcome Back!</h1>
            </div>

            <div class="login__form">
                <form action="" hx-get="" id="form">
                    <fieldset>
                        <div class="phone__number">
                            <label for="tel">Phone Number</label>
                            <input type="tel" name="tel" id="" placeholder="Phone number goes here" required>
                        </div>
                        <div class="password">
                            <label for="password">Password</label>
                            <input type="password" name="" id="" placeholder="Password goes here" required>
                        </div>
                    </fieldset>

                    <div class="submit__btn">
                        <button type="submit">Login</button>
                    </div>
                </form>
                <div id="sign__up__link">
                    <span>Don't have an account? <a href="">Sign Up</a></span>
                </div>
            </div>
        </section>

    </main>






    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.min.js"
        integrity="sha384-RuyvpeZCxMJCqVUGFI0Do1mQrods/hhxYlcVfGPOfQtPJh0JCw12tUAZ/Mv10S7D"
        crossorigin="anonymous"></script>
        <script src="../src/components/header.js"></script>
    <script src="../src/components/telephone.js"></script>


</body>

</html>
