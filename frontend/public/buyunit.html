<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/htmx.org@2.0.4"
        integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"
        crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../src/assets/styles/buyunit.css">
    <link rel="stylesheet" href="../src/assets/styles/general.css">
    <title>Powerzone NG</title>
</head>

<body>


    <main>
        <header class="" id="">
            <nav class="navbar navbar-expand-lg">
                <div class="container-fluid" id="header__container">
                    <div class="logo">
                        <span>Powerzone NG</span>
                    </div>
                    <div class="nav__links">
                        <a href="" hx-get="/">Home</a>
                        <a href="" hx-get="/features">Features</a>
                        <a href="" hx-get="buy__units">Buy Units</a>
                        <a href="" hx-get="/support">Support</a>
                        <a href="" id="sign__up" hx-get="/signup">Sign Up</a>
                        <a href="" hx-get="/login" id="login">Login</a>

                    </div>
                    <div class="mobile__menu__icon">
                        <i class="fa-solid fa-bars" onclick="toggle__menu()"></i>
                    </div>
                </div>
            </nav>
        </header>


        <section class="meter__number">
            <div class="meter__number__form">
                <form action="" id="meter__form">
                    <fieldset>
                        <div class="form__title">
                            <legend>
                                Enter your Electricity Details
                            </legend>
                        </div>

                        <div class="disco__select">
                            <select name="disco" id="disco__field" required>
                                <option value="empty">-- Select your Disco --</option>
                                <option value="AEDC PRE">AEDC (ABUJA) PREPAID</option>
                                <option value="AEDC POST">AEDC (ABUJA) POSTPAID</option>
                                <option value="BEDC PRE">BEDC (BENIN) PREPAID</option>
                                <option value="BEDC POST">BEDC (BENIN) POSTPAID</option>
                                <option value="EEDC PRE">EEDC (ENUGU) PREPAID</option>
                                <option value="EEDC POST">EEDC (ENUGU) POSTPAID</option>
                                <option value="EKEDC PRE">EKEDC (EKO) PREPAID</option>
                                <option value="EKEDC POST">EKEDC (EKO) POSTPAID</option>
                                <option value="IBEDC PRE">IBEDC (IBADAN) PREPAID</option>
                                <option value="IBEDC POST">IBEDC (IBADAN) POSTPAID</option>
                                <option value="IKEDC PRE">IKEDC (IKEJA) PREPAID</option>
                                <option value="IKEDC POST">IKEDC (IKEJA) POSTPAID</option>
                                <option value="JED PRE">JED (JOS) PREPAID</option>
                                <option value="JED POST">JED (JOS) POSTPAID</option>
                                <option value="KAEDCO PRE">KAEDCO (KADUNA) PREPAID</option>
                                <option value="KAEDCO POST">KAEDCO (KADUNA) POSTPAID</option>
                                <option value="KEDCO PRE">KEDCO (KANO) PREPAID</option>
                                <option value="KEDCO POST">KEDCO (KANO) POSTPAID</option>
                                <option value="PHED PRE">PHED (PORT HARCOURT) PREPAID</option>
                                <option value="PHED POST">PHED (PORT HARCOURT) POSTPAID</option>
                                <option value="YEDC PRE">YEDC (YOLA) PREPAID</option>
                                <option value="YEDC POST">YEDC (YOLA) POSTPAID</option>
                            </select>

                            <p id="error__message"></p>


                        </div>
                        <div class="band__select">
                            <select name="" id="band__select__menu">
                                <option value="emptyBand">-- Select your Electricity Band --</option>
                                <option value="BandA">BAND A</option>
                                <option value="BandB">BAND B</option>
                                <option value="BandC">BAND C</option>
                                <option value="BandD">BAND D</option>
                                <option value="BandE">BAND E</option>

                            </select>
                        </div>
                        <div class="meter__num__field">
                            <input type="number" name="" id="meter__field" placeholder="Meter Number" required>
                        </div>
                    </fieldset>
                    <div class="confirm__btn">
                        <button type="submit" id="open__modal">Confirm</button>
                    </div>
                    <div id="modal">
                        <div class="close-icon-container">
                            <a href="" id="close__icon" onclick="return false">Exit</a>
                        </div>

                        <div class="user__details">
                            <h5>User's Name</h5>
                            <p>User's Address</p>
                            <form action="" id="unit__method__form">
                                <fieldset>
                                    <div class="unit__method">
                                        <select name="" id="unit__method__select">
                                            <option value="choose__method">Select Estimate Method</option>
                                            <option value="kwh__estimate">KWH Estimate</option>
                                            <option value="cash__estimate">Cash Estimate</option>
                                        </select>
                                        <p id="unit__error__message"></p>

                                    </div>
                                    <div class="amount">
                                        <input type="number" name="" id="qty__val"
                                            placeholder="Select a method of Purchase">
                                    </div>
                                </fieldset>
                                <div class="confirm__btn">
                                    <button type="submit">Confirm</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </form>

            </div>



        </section>










    </main>






    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.min.js"
        integrity="sha384-RuyvpeZCxMJCqVUGFI0Do1mQrods/hhxYlcVfGPOfQtPJh0JCw12tUAZ/Mv10S7D"
        crossorigin="anonymous"></script>
    <script src="../src/components/header.js"></script>
    <script src="../src/pages/buyunit.js"></script>
</body>

</html>
